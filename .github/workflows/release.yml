name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Calculate release version
        id: release_info
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = gh release view --json tagName,name | ConvertFrom-Json
          $lastTag = [string]$latest.tagName
          if ($lastTag -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$') {
            throw "Latest release tag '$lastTag' is not a vMAJOR.MINOR.PATCH tag."
          }

          $major = $Matches.major
          $minor = $Matches.minor
          $patch = [int]$Matches.patch + 1
          $version = "$major.$minor.$patch"
          $tag = "v$version"
          $title = [string]$latest.name
          if ([string]::IsNullOrWhiteSpace($title)) {
            $title = "VPS Manager $version (Stable Release)"
          } else {
            $previousVersion = $lastTag.Substring(1)
            $updatedTitle = $title -replace [regex]::Escape($previousVersion), $version
            if ($updatedTitle -eq $title) {
              $updatedTitle = "$title $version"
            }
            $title = $updatedTitle
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "title=$title"

      - name: Build release artifacts
        run: build.bat
        shell: cmd
        env:
          VERSION: ${{ steps.release_info.outputs.version }}

      - name: Archive portable app image
        shell: pwsh
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          $image = "dist/VpsManager-$env:VERSION"
          $archive = "dist/VpsManager-$env:VERSION-app-image.zip"
          Compress-Archive -Path $image -DestinationPath $archive -CompressionLevel Optimal

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_info.outputs.title }}
          VERSION: ${{ steps.release_info.outputs.version }}
        run: >-
          gh release create $env:RELEASE_TAG
          "dist/VpsManager-$env:VERSION.jar"
          "dist/VpsManager-$env:VERSION-Setup.exe"
          "dist/VpsManager-$env:VERSION-app-image.zip"
          --title $env:RELEASE_TITLE
          --generate-notes
          --latest